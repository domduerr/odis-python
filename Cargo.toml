[package]
name = "odis-python"
version = "2026.9.1"
authors = ["Dominik Dürrschnabel"]
license = "AGPL-3.0-only"
edition = "2021"
# A `[patch]` redirecting the released `odis` to a sibling working tree belongs
# outside this package: shipped in an sdist, or checked out on its own in CI, the
# sibling path does not exist and cargo fails before compiling anything. The
# redirect lives in the parent directory's .cargo/config.toml; this guards
# against a local one reappearing here.
exclude = [".cargo/"]

[lib]
name = "_odis"
crate-type = ["cdylib"]

[dependencies]
# abi3-py39 builds against the stable ABI, so one wheel per platform serves
# every CPython from 3.9 up rather than needing one per minor version.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
odis = "2026.9.1"
bit-set = "0.8.0"
# `odis::repository` is async because it must also compile for wasm32, where the
# only HTTP path is the browser's fetch API. Python is synchronous, so the bindings
# drive that same future to completion here.
tokio = { version = "1", features = ["rt", "net", "time"] }

# Measured on the DimDraw branch-and-bound proof for the convex-ordinal scale,
# the heaviest search this library runs: 25.1s -> 20.5s, with concept
# enumeration 30% faster and the module 23% smaller. Costs about fifteen
# seconds of build time per target.
#
# Cargo only honours a profile from the package being built and ignores one in a
# dependency, so this is what governs the released wheels; the same block would
# have to be repeated elsewhere to affect another binary.
[profile.release]
lto = "fat"
codegen-units = 1
